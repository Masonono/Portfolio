<!DOCTYPE html>
<!--
  index.html - Portfolio Website
  Structure: Navigation → Header → Images → Footer
-->
<html lang="en">

<head>
  <!-- ===== METADATA ===== -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>First Layout</title>

  <!-- ===== STYLES ===== -->
  <style>
    /* Font imports */
    @import url('https://fonts.googleapis.com/css2?family=Forum&display=swap');

    /* Utility classes */
    .forum-regular {
      font-family: "Forum", serif;
      font-weight: 400;
      font-style: normal;
      font-size: clamp(1.2rem, 2vw, 2.5rem);
    }

    /* Global resets */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(black 0%, white 50%, black 100%);
      font-size: clamp(1rem, 2vw, 1.5rem);
    }

    /* ===== NAVIGATION STYLES ===== */
    nav {
      background-color: black;
      font-family: "Forum", serif;
      padding: 0.5rem 0;
    }

    ul {
      text-align: left;
      padding: 0.25rem 0 0.25rem 100px;
      margin: 0;
    }

    li {
      display: inline-block;
      width: clamp(100px, 15vw, 200px);
      line-height: 1.4;
      font-family: "Forum", serif;
      font-size: clamp(1rem, 2vw, 1.5rem);
    }

    a {
      color: white;
      text-decoration: none;
      display: block;
    }

    /* ===== HEADER STYLES ===== */
    .header-overlay {
      position: absolute;
      top: 8vw;
      font-family: "Forum", serif;
      font-size: clamp(1.5rem, 3vw, 3rem);
      color: black;
      text-align: left;
      padding-left: 6vw;
      width: 100%;
    }

    h1 {
      margin: 0;
      font-weight: 400;
    }

    h2 {
      margin: 0;
      font-weight: 400;
    }

    /* ===== IMAGE STYLES ===== */
    aside {
      overflow: hidden;
    }

    aside img {
      width: 100%;
    }

    .image-grid {
      display: grid;
      grid-template-columns: 1fr 2fr;
      grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
      grid-auto-rows: 1fr;
      align-items: stretch;
      justify-items: stretch;
      gap: 0.2vw;
      width: 100%;
      max-width: 100vw;
      min-width: 280px;
      aspect-ratio: 1 / 1;
    }

    .image-grid .large {
      grid-row: 1 / span 2;
      grid-column: 1 / 2;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      min-width: 0;
      min-height: 0;
      max-width: 100vw;
      max-height: 200vh;
    }

    .image-grid img {
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      object-fit: cover;
      transition: transform 1s ease;
      max-width: 100vw;
    }

    .image-grid img.enlarged {
      position: fixed;
      max-width: 100vw;
      max-height: 100vh;
      width: 60vw;
      height: 60vh;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(1.5);
      z-index: 9999;
      background: white;
      border-radius: 1vw;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    /* ===== FOOTER STYLES ===== */
    footer {
      text-align: right;
      font-family: "Anonymous Pro", monospace;
      color: white;
      font-size: clamp(0.8rem, 1.5vw, 1.2rem);
    }

    /* ===== RESPONSIVE STYLES ===== */
    @media (max-aspect-ratio: 1/1) {
      .image-grid {
        display: flex;
        flex-direction: column;
        gap: 2vw;
        aspect-ratio: unset;
        max-height: 100%;
        overflow-y: auto;
      }

      .image-grid img,
      .image-grid .large {
        width: 100%;
        height: auto;
        max-height: 100%;
        object-fit: cover;
      }
    }
  </style>

  <!-- ===== SCRIPTS ===== -->
  <script>
    /*
      Image interaction logic:
      - Click an image to toggle enlarged state
      - Only one image can be enlarged at a time
      - Click outside to close
    */
    document.addEventListener('DOMContentLoaded', function () {
      const images = document.querySelectorAll('.image-grid img');

      images.forEach(function (img) {
        img.addEventListener('click', function (e) {
          document.querySelectorAll('.image-grid img.enlarged').forEach(function (other) {
            if (other !== img) other.classList.remove('enlarged');
          });
          img.classList.toggle('enlarged');
        });

        document.body.addEventListener('click', function (ev) {
          if (!img.contains(ev.target) && img.classList.contains('enlarged')) {
            img.classList.remove('enlarged');
          }
        }, true);
      });
    });
  </script>
</head>

<body>
  <!-- Top-level container -->
  <div class="container">
    <!-- ===== NAVIGATION BAR ===== -->
    <nav>
      <ul>
        <li> <a href="index.html">Home</a> </li>
        <li> <a href="resume.html">Resume</a> </li>
        <li> <a href="contact.html">Contact</a> </li>
      </ul>
    </nav>

    <!-- ===== HEADER TEXT ===== -->
    <div class="header-overlay">
      <h1>Mason.Bergen@gmail.com</h1>
      <h2>(925)-247-4840</h2>
    </div>

    <!-- ===== IMAGES ===== -->
    <main>
      <aside>
        <div class="wrap">
    <div class="image-gallery">
      <img src="images\Buisness Card Final (Side 2).avif" alt="Mason Bergen's business card, Email address: mason.bergen@gmail.com">
      <img src="images\Buisness Card Final (Side 1).avif" alt="Mason Bergen's business card, Email address: mason.bergen@gmail.com">
    </div>
  </div>
      </aside>
    </main>
  </div>
</body>

</html>
